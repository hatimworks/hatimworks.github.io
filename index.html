<!-- intro animation (~1.5 s, once per visit) -->
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo"><span>S5</span></div>
    <div class="splash-title"><span>G</span><span>u</span><span>i</span><span>d</span><span>e</span></div>
    <div class="splash-sub">zero → hero</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>
<script>
  (function () {
    var s = document.getElementById("splash"), seen = false;
    try { seen = sessionStorage.getItem("s5splash") === "1"; sessionStorage.setItem("s5splash", "1"); } catch (e) {}
    if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { s.remove(); return; }
    document.documentElement.classList.add("splashing");
    setTimeout(function () { s.classList.add("out"); document.documentElement.classList.remove("splashing"); }, 1500);
    setTimeout(function () { s.remove(); }, 2000);
    s.addEventListener("click", function () { s.classList.add("out"); setTimeout(function () { s.remove(); }, 400); });
  })();
</script>
